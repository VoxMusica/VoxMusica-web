name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  install:
    name: 📦 Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🔧 Enable Corepack
        run: npm install -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          retention-days: 1

  # ---------- FRONTEND ----------
  lint-frontend:
    name: 🧹 Lint (frontend)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: node-modules }
      - name: 🔧 Enable Corepack
        run: npm install -g corepack@latest && corepack enable
      - run: yarn frontend:lint

  build-frontend:
    name: 🏗️ Build (frontend)
    needs: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: node-modules }
      - name: 🔧 Enable Corepack
        run: npm install -g corepack@latest && corepack enable
      - run: yarn frontend:build

  # ---------- BACKEND ----------
  lint-backend:
    name: 🧹 Lint (backend)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: node-modules }
      - name: 🔧 Enable Corepack
        run: npm install -g corepack@latest && corepack enable
      - run: yarn frontend:lint

  build-backend:
    name: 🏗️ Build (backend)
    needs: lint-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: node-modules }
      - name: 🔧 Enable Corepack
        run: npm install -g corepack@latest && corepack enable
      - run: yarn frontend:build

  publish-frontend:
    name: 🐳 Publish frontend
    needs: [build-frontend, build-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set image tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${REGISTRY}/${IMAGE_NAMESPACE}/frontend:latest,${REGISTRY}/${IMAGE_NAMESPACE}/frontend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REGISTRY}/${IMAGE_NAMESPACE}/frontend:dev,${REGISTRY}/${IMAGE_NAMESPACE}/frontend:dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 🐳 Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=frontend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=frontend-${{ github.ref_name }}

  publish-backend:
    name: 🐳 Publish backend
    needs: [build-frontend, build-backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Set image tags
        id: tags
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tags=${REGISTRY}/${IMAGE_NAMESPACE}/backend:latest,${REGISTRY}/${IMAGE_NAMESPACE}/backend:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REGISTRY}/${IMAGE_NAMESPACE}/backend:dev,${REGISTRY}/${IMAGE_NAMESPACE}/backend:dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: 🐳 Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=backend-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=backend-${{ github.ref_name }}
