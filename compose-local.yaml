# docker-compose.yml
name: voxmusica

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6378:6379'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ['main']
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6378'
    expose:
      - '4200'
    volumes:
      - backend-config:/data
      - backend-data:/config
    depends_on:
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ['worker']
    volumes:
      - backend-config:/data
      - backend-data:/config
    depends_on:
      redis:
        condition: service_started
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001
    expose:
      - '5173'
    depends_on:
      - backend


  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  backend-config:
  backend-data: